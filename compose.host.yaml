# Local host-network workaround for this NAS Docker published-port timeout.
# Run with: docker compose -f compose.yaml -f compose.host.yaml up -d
services:
  x-read:
    network_mode: host
    ports: !reset []
    environment:
      X_READ_HOST: ${X_READ_BIND_ADDRESS:-127.0.0.1}
      X_READ_PORT: ${X_READ_PORT:-18081}
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import os,urllib.request; h=os.environ['X_READ_HOST']; h='127.0.0.1' if h=='0.0.0.0' else h; urllib.request.build_opener(urllib.request.ProxyHandler({})).open('http://'+h+':'+os.environ['X_READ_PORT']+'/health', timeout=3)"
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
