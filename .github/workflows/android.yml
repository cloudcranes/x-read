name: android

# 打包交给 GitHub：推送到 main 出 debug 包，打 v* 标签出签名 release 包并附到 Release。
# 签名口令只放在 Secrets 里，工作流本身不落任何凭据。
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NDK_VERSION: 27.2.12479018
  JAVA_VERSION: "21"

jobs:
  python-tests:
    name: Python 测试（173 项）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[test]"

      # 测试必须是自足的：仓库里没有 .env（已 gitignore），CI 也不提供。
      - run: python -m pytest -q

  android-apk:
    name: 安卓 APK（arm64-v8a）
    runs-on: ubuntu-latest
    permissions:
      contents: write # 打标签时需要创建 Release
    env:
      KEYSTORE_B64: ${{ secrets.XREAD_KEYSTORE_BASE64 }}
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4

      - name: 安装 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: 启用 Gradle 缓存
        uses: gradle/actions/setup-gradle@v4

      # NDK 不预装在 runner 上，且脚本按 r27c 的 ABI 布局找 linker，缺了就拒绝构建。
      - name: 安装 NDK r27c
        run: |
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --install "ndk;${NDK_VERSION}" > /dev/null
          echo "ANDROID_NDK_HOME=$SDK/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      # 运行镜像上的 rustup 没有默认工具链，脚本里的裸 cargo 会报
      # "rustup could not choose version of cargo run"，这里显式指定。
      - name: 设为默认工具链
        run: rustup default stable && rustc --version && cargo --version

      - name: 缓存 Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: android/native-core

      - name: 编译原生核心（arm64-v8a）
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/android/native-core/target
        run: |
          # 脚本在本地会退回 /tmp 下的自有工具链目录；CI 必须指回宿主 rustup，
          # 否则 RUSTUP_HOME 指向空目录，cargo 报 “no default is configured”。
          export RUSTUP_HOME="${RUSTUP_HOME:-$HOME/.rustup}"
          export CARGO_HOME="${CARGO_HOME:-$HOME/.cargo}"
          bash scripts/build_native_core.sh

      # 没有 Secrets 时仍出 debug 包，保证 PR 与 fork 也能跑通；
      # release 只认 release.keystore，不回退 debug 签名。
      - name: 还原 release 签名
        if: env.KEYSTORE_B64 != ''
        run: |
          mkdir -p android/signing
          printf '%s' "$KEYSTORE_B64" | base64 --decode > android/signing/release.keystore
          test -s android/signing/release.keystore

      - name: Kotlin 单测 + 打包
        env:
          XREAD_KEYSTORE_PASS: ${{ secrets.XREAD_KEYSTORE_PASS }}
          XREAD_KEY_ALIAS: ${{ secrets.XREAD_KEY_ALIAS }}
          XREAD_KEY_PASS: ${{ secrets.XREAD_KEY_PASS }}
        run: |
          if [ -f android/signing/release.keystore ]; then
            android/gradlew -p android --no-daemon :app:testDebugUnitTest :app:assembleRelease
          else
            android/gradlew -p android --no-daemon :app:testDebugUnitTest :app:assembleDebug
          fi

      - name: 交付自检
        if: env.KEYSTORE_B64 != ''
        run: bash scripts/verify_apk.sh android/app/build/outputs/apk/release/app-release.apk

      - name: 收集产物
        id: apk
        run: |
          if [ -f android/app/build/outputs/apk/release/app-release.apk ]; then
            SRC=android/app/build/outputs/apk/release/app-release.apk
            OUT=x-read-standalone.apk
          else
            SRC=android/app/build/outputs/apk/debug/app-debug.apk
            OUT=x-read-debug.apk
          fi
          cp "$SRC" "$OUT"
          echo "file=$OUT" >> "$GITHUB_OUTPUT"
          ls -l "$OUT"

      # 只在「签名包 + 打标签」的组合下生成：debug 包不能当热更新源，
      # 也不该让开发机构建产生更新清单。
      - name: 生成热更新清单
        if: startsWith(github.ref, 'refs/tags/v') && steps.apk.outputs.file == 'x-read-standalone.apk'
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, re

          gradle = pathlib.Path("android/app/build.gradle").read_text(encoding="utf-8")
          version = re.search(r'versionName\s+"([^"]+)"', gradle).group(1)
          code = int(re.search(r'versionCode\s+(\d+)', gradle).group(1))
          apk = pathlib.Path(os.environ["APK_FILE"])
          tag, repo = os.environ["GITHUB_REF_NAME"], os.environ["GITHUB_REPOSITORY"]
          display = version.removesuffix("-standalone")
          manifest = {
              "versionName": display,
              "versionCode": code,
              "url": f"https://github.com/{repo}/releases/download/{tag}/{apk.name}",
              "size": apk.stat().st_size,
              "sha256": hashlib.sha256(apk.read_bytes()).hexdigest(),
              "notes": f"拾页 {display}",
          }
          pathlib.Path("update.json").write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2) + "\n", encoding="utf-8"
          )
          print(json.dumps(manifest, ensure_ascii=False))
          PY
        env:
          APK_FILE: ${{ steps.apk.outputs.file }}

      - uses: actions/upload-artifact@v4
        with:
          name: x-read-apk
          path: |
            ${{ steps.apk.outputs.file }}
            update.json
          if-no-files-found: error
          retention-days: 30

      - name: 附到 GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ steps.apk.outputs.file }}
            update.json
          fail_on_unmatched_files: false
          generate_release_notes: true
