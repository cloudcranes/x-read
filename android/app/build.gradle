plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.alanmaster.xread'
    compileSdk 34

    defaultConfig {
        // Separate install preserves the existing application's key and private files.
        applicationId "com.alanmaster.xread.standalone"
        minSdk 24
        targetSdk 34
        versionCode 19
        versionName "4.1.0-standalone"
        // 只发 arm64-v8a：x86 模拟器上即便补一份 x86_64 原生库也无法访问上游
        // 注册域名（*.snssdk.com 解析到 fake-IP 且无人接管），多带的 9MB 没有收益。
        ndk { abiFilters 'arm64-v8a' }
    }

    /**
     * 签名。
     *
     * - release 用仓库内 `signing/release.keystore`，密码只从环境变量
     *   XREAD_KEYSTORE_PASS / XREAD_KEY_ALIAS / XREAD_KEY_PASS 读取，
     *   不写进构建文件，也不进 argv。
     *   **绝不回退到 debug 签名**：旧实现缺 keystore 时静默改用 debug 签名，
     *   产物仍叫 app-release.apk，换机后就会发出去一个 debug 证书的包。
     *   现在缺 keystore 时 release 无签名配置，产出 app-release-unsigned.apk，
     *   scripts/build_apk.sh 找不到 app-release.apk 即失败。
     * - debug 保留，仅用于本地调试安装，不作为交付物。
     */
    signingConfigs {
        debug {
            storeFile rootProject.file('signing/debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        release {
            def ks = rootProject.file('signing/release.keystore')
            if (ks.exists()) {
                storeFile ks
                // 口令只从环境变量读，不写进构建文件；缺失时 zip 阶段会明确报错，
                // 而不是静默产出未签名包。
                storePassword = System.getenv('XREAD_KEYSTORE_PASS')
                keyAlias = System.getenv('XREAD_KEY_ALIAS') ?: 'xread'
                keyPassword = System.getenv('XREAD_KEY_PASS') ?: System.getenv('XREAD_KEYSTORE_PASS')
            }
        }
    }

    buildTypes {
        release {
            // 交付包必须不可调试：可调试包能被 run-as 直接读到内容核心的
            // pool.key 与解密后的音频缓存。
            debuggable false
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // 缺 release.keystore 时不配置签名，产物为 app-release-unsigned.apk；
            // 不做 debug 回退，避免静默发出 debug 证书的 release 包。
            if (signingConfigs.release.storeFile != null) {
                signingConfig signingConfigs.release
            }
        }
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        compose true
        // BuildConfig.DEBUG 用于在 release 里关掉日志
        buildConfig true
    }

    composeOptions {
        kotlinCompilerExtensionVersion '1.5.14'
    }

    packaging {
        resources.excludes += 'META-INF/{AL2.0,LGPL2.1}'
        // 16 KB 页对齐（Android 15 要求）；NDK r27 起通过链接参数控制，
        // 这里同时保证打包时不压缩 .so，便于直接从 APK mmap。
        jniLibs.useLegacyPackaging = false
    }

    lint {
        // 缺翻译等不阻断交付；真正的错误仍然失败
        abortOnError true
        checkReleaseBuilds true
    }
}

dependencies {
    // 2024.10.01 = material3 1.3.1 + compose 1.7.5。
    // 1.3.x 才引入官方 PullToRefreshBox（1.2.x 只有状态机、没有 Box）。
    // compose compiler 1.5.14 与 runtime 1.7.5 兼容：compiler 的版本闸门是
    // 「runtime 版本号 >= 3300 就直接放行」，1.7.5 = 12900，过。
    implementation platform('androidx.compose:compose-bom:2024.10.01')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.activity:activity-compose:1.9.0'
    // NotificationCompat：后台播放控制条
    implementation 'androidx.core:core-ktx:1.13.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.2'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.8.2'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'
    implementation 'io.coil-kt:coil-compose:2.6.0'
    debugImplementation 'androidx.compose.ui:ui-tooling'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}
