<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8">
<link rel="stylesheet" href="base.css">
<style>
/* 本地子集字体（woff2，共 337KB），保证离线也能复现设计图。
 * 换字/加字后需重新子集化，见 docs/ui-v3/README.md。
 */
@font-face { font-family:'SerifSC'; src:url('../fonts/Noto_Serif_SC-400.woff2') format('woff2'); font-weight:400; }
@font-face { font-family:'SerifSC'; src:url('../fonts/Noto_Serif_SC-700.woff2') format('woff2'); font-weight:700; }
@font-face { font-family:'SansSC';  src:url('../fonts/Noto_Sans_SC-400.woff2')  format('woff2'); font-weight:400; }
@font-face { font-family:'SansSC';  src:url('../fonts/Noto_Sans_SC-500.woff2')  format('woff2'); font-weight:500; }
@font-face { font-family:'SansSC';  src:url('../fonts/Noto_Sans_SC-700.woff2')  format('woff2'); font-weight:700; }
@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700&family=Noto+Sans+SC:wght@400;500;700&display=swap');
  .toc-head { padding:var(--s4) var(--gutter) 0; }
  .book-line { display:flex; align-items:center; gap:10px; }
  .book-n { font-family:'SerifSC'; font-weight:700; font-size:19px; line-height:26px; flex:1;
            min-width:0; overflow:hidden; white-space:nowrap; text-overflow:ellipsis; }
  .toc-sub { font-size:11px; color:var(--ink-3); margin-top:2px; }

  .toc-tools { display:flex; align-items:center; gap:8px; padding:10px var(--gutter); }
  .sort-btn { display:flex; align-items:center; gap:5px; height:32px; padding:0 10px;
              border:1px solid var(--rule-2); border-radius:var(--r-card);
              font-size:12px; color:var(--ink-2); background:var(--surface); }
  .filter { flex:1; height:32px; border:1px solid var(--rule-2); border-radius:var(--r-card);
            display:flex; align-items:center; gap:6px; padding:0 9px;
            font-size:12px; color:var(--ink-3); background:var(--surface); }

  /* 吸顶：卷/章数条 */
  .stick { display:flex; align-items:center; justify-content:space-between;
           padding:7px var(--gutter); background:#F4F2EC; border-top:1px solid var(--rule);
           border-bottom:1px solid var(--rule); }
  .stick-l { font-size:10px; letter-spacing:.1em; color:var(--ink-3); }
  .stick-r { font-size:10px; color:var(--ink-3); font-variant-numeric:tabular-nums; }

  .ch { display:flex; align-items:center; gap:10px; padding:0 var(--gutter); height:48px;
        position:relative; }
  .ch-n { font-size:10px; color:var(--ink-3); width:30px; flex:none;
          font-variant-numeric:tabular-nums; }
  .ch-t { flex:1; min-width:0; font-size:13.5px; color:var(--ink);
          overflow:hidden; white-space:nowrap; text-overflow:ellipsis; }
  .ch-dl { width:14px; height:14px; flex:none; stroke:var(--ink-3); stroke-width:1.6; fill:none; }
  .ch.cur { background:#FBF1EC; }
  .ch.cur::before { content:''; position:absolute; left:0; top:10px; bottom:10px; width:2px; background:var(--accent); }
  .ch.cur .ch-t { color:var(--accent); font-weight:500; }
  .ch.cur .ch-n { color:var(--accent); }

  .ch + .ch { border-top:1px solid var(--rule); }

  /* 右下悬浮：定位到当前章 */
  .locate { position:absolute; right:16px; bottom:16px; height:38px; padding:0 14px;
            background:var(--ink); color:#FFF; border-radius:19px; display:flex;
            align-items:center; gap:6px; font-size:12px; font-weight:500;
            box-shadow:0 2px 8px rgba(22,21,15,.18); }
  .locate svg { width:14px; height:14px; stroke:#FFF; stroke-width:1.8; fill:none; }
</style></head><body><div class="screen" style="position:relative">

  <div class="statusbar"><span class="num">9:41</span><span class="num">5G · 82%</span></div>

  <div class="page-head" style="padding-bottom:0">
    <div class="head-row">
      <div class="icon-btn" style="border:none;background:transparent;padding:0;width:28px">
        <svg class="icon" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>
      </div>
      <div class="t-h2">目录</div>
      <div style="width:28px"></div>
    </div>
  </div>

  <div class="toc-head">
    <div class="book-line">
      <div class="book-n">十日终焉</div>
    </div>
    <div class="toc-sub num">杀虫队队员 · 共 1496 章 · 已下载 483 章</div>
  </div>

  <div class="toc-tools">
    <div class="sort-btn">
      <span>正序</span>
      <svg class="icon" viewBox="0 0 24 24" style="width:12px;height:12px"><path d="M8 9l4-4 4 4M8 15l4 4 4-4"/></svg>
    </div>
    <div class="filter">
      <svg class="icon" viewBox="0 0 24 24" style="width:13px;height:13px"><circle cx="11" cy="11" r="6"/><path d="M15.5 15.5 20 20"/></svg>
      <span>筛选章节标题</span>
    </div>
  </div>

  <div class="stick">
    <span class="stick-l num">CURRENT · 第 2 章</span>
    <span class="stick-r">已定位</span>
  </div>

  <div class="scroll">
    <div class="ch"><span class="ch-n num">1</span><span class="ch-t">第 1 章 十人</span>
      <svg class="ch-dl" viewBox="0 0 24 24"><path d="M12 4v10M12 14l-4-4M12 14l4-4M5 18h14"/></svg></div>
    <div class="ch cur"><span class="ch-n num">2</span><span class="ch-t">第 2 章 说谎</span>
      <svg class="ch-dl" viewBox="0 0 24 24"><path d="M12 4v10M12 14l-4-4M12 14l4-4M5 18h14"/></svg></div>
    <div class="ch"><span class="ch-n num">3</span><span class="ch-t">第 3 章 规则是绝对的</span>
      <svg class="ch-dl" viewBox="0 0 24 24"><path d="M12 4v10M12 14l-4-4M12 14l4-4M5 18h14"/></svg></div>
    <div class="ch"><span class="ch-n num">4</span><span class="ch-t">第 4 章 灾难？</span></div>
    <div class="ch"><span class="ch-n num">5</span><span class="ch-t">第 5 章 医生</span></div>
    <div class="ch"><span class="ch-n num">6</span><span class="ch-t">第 6 章 警官</span></div>
    <div class="ch"><span class="ch-n num">7</span><span class="ch-t">第 7 章 赢面</span></div>
    <div class="ch"><span class="ch-n num">8</span><span class="ch-t">第 8 章 摊牌</span></div>
    <div class="ch"><span class="ch-n num">9</span><span class="ch-t">第 9 章 难以接受的真相</span></div>
    <div class="ch"><span class="ch-n num">10</span><span class="ch-t">第 10 章 终焉</span></div>
    <div class="ch"><span class="ch-n num">11</span><span class="ch-t">第 11 章 第二个房间</span></div>
    <div class="ch"><span class="ch-n num">12</span><span class="ch-t">第 12 章 交换</span></div>
    <div class="ch"><span class="ch-n num">13</span><span class="ch-t">第 13 章 沉默的证人</span></div>
    <div class="ch"><span class="ch-n num">14</span><span class="ch-t">第 14 章 十三个名字</span></div>
  </div>

  <div class="locate">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="2"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>
    <span>定位到当前章</span>
  </div>
</div><script src="measure.js"></script></body></html>
