services:
  x-read:
    build: .
    ports:
      - "${X_READ_BIND_ADDRESS:-127.0.0.1}:${X_READ_PORT:-8080}:8080"
    environment:
      X_READ_HOST: 0.0.0.0
      X_READ_PORT: "8080"
      X_READ_DB: /data/x-read.sqlite3
      X_READ_API_TOKEN: ${X_READ_API_TOKEN:-}
      X_READ_ALLOW_ANONYMOUS: ${X_READ_ALLOW_ANONYMOUS:-false}
      X_READ_METADATA_TTL: ${X_READ_METADATA_TTL:-600}
      X_READ_CHAPTER_TTL: ${X_READ_CHAPTER_TTL:-604800}
      X_READ_CACHE_BUDGET_BYTES: ${X_READ_CACHE_BUDGET_BYTES:-268435456}
      X_READ_CORS_ORIGINS: ${X_READ_CORS_ORIGINS:-}
    volumes:
      - reader-data:/data
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
volumes:
  reader-data:
