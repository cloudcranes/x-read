[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "x-read"
version = "0.1.0"
description = "Source-neutral personal reading backend"
requires-python = ">=3.11"
license-files = ["THIRD_PARTY_NOTICES.md"]
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.27,<1"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2"]

[tool.setuptools.packages.find]
include = ["x_read*"]

[tool.setuptools.package-data]
x_read = ["data/*.json", "web/*.html", "web/*.webmanifest", "web/*.png"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
